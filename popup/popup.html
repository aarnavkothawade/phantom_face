<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivacyShield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="shield-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        <div>
          <h2>PrivacyShield</h2>
          <span class="subtext">Local Privacy Vision Agent</span>
        </div>
      </div>
      <span class="badge active">MV3 READY</span>
    </header>

    <!-- Status Overview -->
    <section class="status-card">
      <div class="status-row">
        <span class="label">Client Engine:</span>
        <span class="value" id="client-engine">BlazeFace + BERT/Regex</span>
      </div>
      <div class="status-row">
        <span class="label">Zero PII Leakage:</span>
        <span class="value verified">● Guaranteed</span>
      </div>
      <div class="status-row">
        <span class="label">Proxy Endpoint:</span>
        <span class="value" id="proxy-url-display">localhost:3001</span>
      </div>
    </section>

    <!-- Action Buttons -->
    <div class="actions">
      <button class="primary-btn" id="btn-trigger-active-tab">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        <span>Activate on Active Page</span>
      </button>

      <button class="secondary-btn" id="btn-open-benchmark">
        <svg viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        <span>Open Benchmark Test Page</span>
      </button>

      <button class="secondary-btn" id="btn-open-options">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <span>Settings & Local Profile</span>
      </button>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>ISRO SIH Submission</span>
      <span style="color:#00f2fe;">v1.0.0</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
